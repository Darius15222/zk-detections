# Suricata eve.json -> ECS. Input/output blocks live where the pipeline runs (zk-platform, tests/harness.conf).
# Based on the course example cybrd0ne/secops-demo (pipelines/suricata.conf).
filter {
  json {
    source => "message"
    target => "[suricata][eve]"
    tag_on_failure => ["_jsonparsefailure"]
  }

  # stats are Suricata's own counters every few seconds: no security value, drop before indexing
  if [suricata][eve][event_type] == "stats" {
    drop {}
  }

  if "_jsonparsefailure" not in [tags] {
    mutate { rename => { "message" => "[event][original]" } }
    date {
      match => ["[suricata][eve][timestamp]", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ", "ISO8601"]
      target => "@timestamp"
    }
    mutate {
      add_field => {
        "[event][module]"  => "suricata"
        "[event][dataset]" => "suricata.eve"
        "[event][kind]"    => "event"
        "[event][category]" => "network"
      }
      rename => {
        "[suricata][eve][src_ip]"       => "[source][ip]"
        "[suricata][eve][src_port]"     => "[source][port]"
        "[suricata][eve][dest_ip]"      => "[destination][ip]"
        "[suricata][eve][dest_port]"    => "[destination][port]"
        "[suricata][eve][proto]"        => "[network][transport]"
        "[suricata][eve][app_proto]"    => "[network][protocol]"
        "[suricata][eve][community_id]" => "[network][community_id]"
        "[suricata][eve][in_iface]"     => "[observer][ingress][interface][name]"
        "[suricata][eve][flow_id]"      => "[suricata][flow_id]"
        "[suricata][eve][event_type]"   => "[suricata][event_type]"
      }
    }
    mutate { lowercase => ["[network][transport]", "[network][protocol]"] }

    if [suricata][event_type] == "alert" {
      mutate {
        replace => { "[event][kind]" => "alert" }
        add_field => { "[event][type]" => "info" "[event][category]" => "intrusion_detection" }
        rename => {
          "[suricata][eve][alert][signature_id]" => "[rule][id]"
          "[suricata][eve][alert][signature]"    => "[rule][name]"
          "[suricata][eve][alert][category]"     => "[rule][category]"
          "[suricata][eve][alert][severity]"     => "[event][severity]"
        }
      }
    }
    if [suricata][eve][http] {
      mutate {
        rename => {
          "[suricata][eve][http][http_method]"     => "[http][request][method]"
          "[suricata][eve][http][status]"          => "[http][response][status_code]"
          "[suricata][eve][http][http_user_agent]" => "[user_agent][original]"
          "[suricata][eve][http][hostname]"        => "[url][domain]"
          "[suricata][eve][http][url]"             => "[url][original]"
        }
      }
    }
    if [suricata][event_type] == "dns" {
      mutate {
        rename => {
          "[suricata][eve][dns][rrname]" => "[dns][question][name]"
          "[suricata][eve][dns][rrtype]" => "[dns][question][type]"
        }
      }
    }
    mutate { remove_field => ["[suricata][eve][timestamp]"] }
  }
}
